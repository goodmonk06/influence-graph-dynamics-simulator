version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: influence-db
    environment:
      POSTGRES_USER: influence
      POSTGRES_PASSWORD: influence_dev_password
      POSTGRES_DB: influence_graph
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U influence']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
